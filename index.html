<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WARDOGS — Fire Control</title>
<style>
:root{--bg:#0c0f0d;--panel:#151a17;--line:#303a33;--text:#eef3ef;--muted:#98a39c;--accent:#d7ff42;--bad:#ff6464}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#1a211c,#0c0f0d 48%);color:var(--text);font-family:Segoe UI,Arial,sans-serif;display:grid;place-items:center;padding:24px}.app{width:min(760px,100%);background:rgba(21,26,23,.96);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 25px 70px #0008}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:3px}.kicker{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.18em;padding-top:10px}.language{border:1px solid #39443c;background:#111613;color:#fff;border-radius:9px;padding:9px 12px;font-size:14px;outline:none;cursor:pointer}.language:focus{border-color:var(--accent)}.title{font-size:30px;font-weight:800;margin:5px 0}.sub{color:var(--muted);margin:0 0 24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.coords{display:grid;grid-template-columns:1fr 1fr;gap:10px}.coord label{font-size:11px;text-align:center}.box{background:#0e120f;border:1px solid var(--line);border-radius:12px;padding:14px}label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:7px}input{width:100%;border:1px solid #39443c;background:#111613;color:#fff;border-radius:9px;padding:13px;font-size:16px;outline:none}input:focus{border-color:var(--accent)}button{width:100%;margin-top:16px;border:0;border-radius:10px;background:var(--accent);color:#10130f;font-weight:900;padding:14px;font-size:16px;cursor:pointer}.result{display:none;margin-top:18px;border:1px solid var(--line);border-radius:14px;padding:20px;background:#0e120f}.distance{font-size:52px;font-weight:900;line-height:1;color:var(--accent)}.unit{font-size:20px;color:var(--muted)}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.stat{border-top:1px solid var(--line);padding-top:12px}.stat b{font-size:20px}.error{color:var(--bad);margin-top:12px;display:none}.help{margin-top:18px;color:var(--muted);font-size:13px;line-height:1.55}.help code{color:#dbe6de}@media(max-width:600px){.grid,.row{grid-template-columns:1fr}.top{align-items:center}.title{font-size:25px}.distance{font-size:44px}.language{max-width:150px}}
.gabriel-credit{position:fixed;right:12px;bottom:8px;font-size:10px;color:#7f8b83;opacity:.65;letter-spacing:.2px;z-index:999;user-select:none}
</style></head>
<body><main class="app">
<div class="top"><div class="kicker">WARDOGS • FIRE CONTROL</div><select id="language" class="language" aria-label="Language"><option value="pt">🇧🇷 Português</option><option value="en">🇺🇸 English</option><option value="es">🇪🇸 Español</option><option value="zh">🇨🇳 中文</option></select></div>
<div id="title" class="title"></div><p id="sub" class="sub"></p>
<div class="grid"><div class="box"><label id="originLabel"></label><div class="coords"><div class="coord"><label>X</label><input id="originX" inputmode="decimal" placeholder="95.85" autofocus></div><div class="coord"><label>Y</label><input id="originY" inputmode="decimal" placeholder="109.08"></div></div></div><div class="box"><label id="targetLabel"></label><div class="coords"><div class="coord"><label>X</label><input id="targetX" inputmode="decimal" placeholder="102.42"></div><div class="coord"><label>Y</label><input id="targetY" inputmode="decimal" placeholder="115.73"></div></div></div></div>
<button id="calc"></button><div id="error" class="error"></div>
<section id="result" class="result"><label id="distanceLabel"></label><span id="meters" class="distance">0</span> <span class="unit">m</span><div class="row"><div class="stat"><label id="bearingLabel"></label><b id="bearing">0°</b></div><div class="stat"><label id="exactLabel"></label><b id="exact">0.0 m</b></div></div></section>
<div id="help" class="help"></div>
</main>
<script>
const T={
pt:{credit:'Feito por Gabriel Porto',title:'Calculadora de distância',sub:'Digite X e Y separadamente nos campos abaixo.',origin:'POSIÇÃO DO MORTEIRO / DISPARO',target:'POSIÇÃO DO ALVO',calc:'CALCULAR DISPARO',error:'Preencha os quatro campos X e Y com números válidos.',distance:'DISTÂNCIA PARA O ALVO',bearing:'DIREÇÃO / BEARING',exact:'DISTÂNCIA EXATA',help:'No jogo: coloque o valor de <code>X</code> e <code>Y</code> da sua posição nos dois primeiros campos e o <code>X</code> e <code>Y</code> do alvo nos dois campos seguintes.'},
en:{credit:'Made by Gabriel Porto',title:'Distance calculator',sub:'Enter X and Y separately in the fields below.',origin:'MORTAR / FIRING POSITION',target:'TARGET POSITION',calc:'CALCULATE SHOT',error:'Fill in all four X and Y fields with valid numbers.',distance:'DISTANCE TO TARGET',bearing:'DIRECTION / BEARING',exact:'EXACT DISTANCE',help:'In game: enter your position <code>X</code> and <code>Y</code> in the first two fields, then the target <code>X</code> and <code>Y</code> in the next two fields.'},
es:{credit:'Hecho por Gabriel Porto',title:'Calculadora de distancia',sub:'Introduce X e Y por separado en los campos de abajo.',origin:'POSICIÓN DEL MORTERO / DISPARO',target:'POSICIÓN DEL OBJETIVO',calc:'CALCULAR DISPARO',error:'Completa los cuatro campos X e Y con números válidos.',distance:'DISTANCIA AL OBJETIVO',bearing:'DIRECCIÓN / RUMBO',exact:'DISTANCIA EXACTA',help:'En el juego: introduce <code>X</code> e <code>Y</code> de tu posición en los dos primeros campos y los del objetivo en los dos siguientes.'},
zh:{credit:'Gabriel Porto 制作',title:'距离计算器',sub:'请在下方分别输入 X 和 Y。',origin:'迫击炮 / 射击位置',target:'目标位置',calc:'计算射击',error:'请在四个 X 和 Y 输入框中填写有效数字。',distance:'目标距离',bearing:'方向 / 方位角',exact:'精确距离',help:'游戏中：在前两个输入框分别填写你的位置 <code>X</code> 和 <code>Y</code>，然后在后两个输入框填写目标的 <code>X</code> 和 <code>Y</code>。'}
};
const ids=['credit','title','sub','originLabel','targetLabel','calc','error','distanceLabel','bearingLabel','exactLabel','help'];
function setLang(lang){const t=T[lang]||T.pt;const v=[t.credit,t.title,t.sub,t.origin,t.target,t.calc,t.error,t.distance,t.bearing,t.exact,t.help];ids.forEach((id,i)=>document.getElementById(id).innerHTML=v[i]);document.documentElement.lang=lang==='pt'?'pt-BR':lang;localStorage.setItem('wardogsLang',lang)}
function readNumber(el){const v=(el.value||'').trim().replace(',','.');if(v==='')return null;const n=Number(v);return Number.isFinite(n)?n:null}
function calculate(){const ax=readNumber(originX),ay=readNumber(originY),bx=readNumber(targetX),by=readNumber(targetY);if([ax,ay,bx,by].some(v=>v===null)){error.style.display='block';result.style.display='none';return}error.style.display='none';const dx=bx-ax,dy=by-ay,d=Math.sqrt(dx*dx+dy*dy)*100;let br=Math.atan2(dx,dy)*180/Math.PI;if(br<0)br+=360;meters.textContent=Math.round(d);exact.textContent=d.toFixed(1)+' m';bearing.textContent=br.toFixed(1)+'°';result.style.display='block'}
language.value=localStorage.getItem('wardogsLang')||'pt';setLang(language.value);language.addEventListener('change',()=>setLang(language.value));calc.onclick=calculate;document.addEventListener('keydown',e=>{if(e.key==='Enter')calculate()});
</script><div id="credit" class="gabriel-credit">Feito por Gabriel Porto</div>
</body></html>
